# =============================================================
# 细胞培养接种与批次配置规划软件 — 集中配置文件
# 阈值来源：requirements.md 第二/3.1/五节 + 用户第一轮答复（决策记录见 README.md）
# 第五节 18 条校验规则与全部公式参数一律从本文件读取，严禁代码硬编码
# 最后更新：2026-11-11（第三轮：process_defaults 等改为块状写法，供"硬件配置"页安全回写；新增 recipes 配方段）
# 注意：请勿把下面的标量值改回 { a: 1, b: 2 } 行内写法，硬件配置页回写工具只支持逐行标量修改（行内写法会报错拒写，不会损坏文件）
# =============================================================

hardware:                           # 第二节：Applikon my-Control 3L 硬件上下限（硬件配置页可改）
  reactor_model: "Applikon my-Control 3 L"
  total_volume_ml: 3100             # 总容积 3.1 L
  min_working_volume_ml: 600        # 规则 R01 下限（硬件配置页可改）
  max_working_volume_ml: 2400       # 规则 R01 上限（硬件配置页可改）
  mfc_max_ml_min:                   # 规则 R02-R04：质量流量计量程（硬件配置页可改）
    air: 1500
    n2: 1500
    o2: 1500
    co2: 800
  sparger_required: "sintered"      # 规则 R16：必须烧结曝气头，界面禁止选 L 型管直吹
  impeller_type: "Marine"           # Marine 叶轮（低剪切，细胞培养专用）

process_defaults:                   # 3.1 节：默认工艺参数（界面可改，改后仍受范围校验；硬件配置页可改默认/上下限）
  temp_growth_c:                    # 生长阶段温度（R11 整体区间 34.0-37.0）
    set: 37.0
    min: 36.5
    max: 37.0
  temp_expression_c:                # 表达阶段温度（可选降温）
    set: 35.0
    min: 34.0
    max: 36.0
  ph_setpoint:                      # 规则 R10
    set: 7.05
    min: 7.00
    max: 7.20
  do_percent:                       # 规则 R09；答复#7：默认 50%、最低 40%
    set: 50
    min: 40
    max: 70
  agitation_rpm:                    # 规则 R05
    set: 100
    min: 80
    max: 150
  aeration_vvm:                     # 规则 R14：0.05-0.1 vvm
    set: 0.1
    min: 0.05
    max: 0.1
  o2_ratio_percent:                 # 规则 R12
    set: 10
    min: 0
    max: 20
  co2_ratio_percent:                # 规则 R13，推荐区间 10-25
    set: 10
    min: 0
    max: 25
  inoculum_density_mcells_ml:       # CD_inoc，界面单位统一 x10^6 cells/mL（答复#5）
    set: 0.4
    min: 0.3
    max: 0.5
  culture_days:                     # 规则 R18：7-14 天
    set: 10
    min: 7
    max: 14

liquid_additives:                   # 答复#1：公式2 V_medium = V_work - V_seed - V_base - V_antifoam
  base_type: "7.5% NaHCO3"          # 碱液种类（界面可改）
  base_fraction_of_working:         # 碱液默认预留工作体积 2%（界面可改）
    default: 0.02
    min: 0.0
    max: 0.05
  antifoam_fraction_of_working:     # 消泡剂默认 0.1%（2 L 时约 2 mL）
    default: 0.001
    min: 0.0
    max: 0.01

mixing_physics:                     # 答复#2/#3/#4：公式7 能量耗散；公式8 剪切速率暂缓
  broth_density_kg_m3: 1000         # rho 按 1000 近似（答复#4）
  power_number_np: 0.35             # Marine/推进式湍流典型 Np，与细胞株无关（答复#2）
  impeller_diameter_m: null         # 【用户决定2026-11-11】暂保留 null。D 为 null 时：不计算 ε，也不判 R06 红/黄，改为输出黄色警告"⚠️ 缺少叶轮直径参数，无法计算剪切力，请后续在配置中补充"，严禁报错崩溃
  rpm_to_rad_s: "N[rad/s] = rpm / 60 * 2 * pi"
  epsilon_red_w_kg: 0.1             # 规则 R06 收紧：ε > 0.1 W/kg 报红禁止（答复#2，取代原文档 1.0）
  epsilon_yellow_w_kg: 0.05         # ε > 0.05 W/kg 报黄
  epsilon_recommended_w_kg: [0.02, 0.04]   # 工作推荐区（依据：工业 CHO 罐 P/V 22-35 W/m3，rho=1000 换算）
  shear_gamma_enabled: true         # 第四轮（2026-11-11 用户指令）：启用剪切速率估算展示；k 为 null 时界面输出黄色警告而不是报错
  impeller_constant_k: null         # 叶轮常数 k（无量纲）：γ = k x N，N = rpm÷60（转/秒）。等用户提供文献/铭牌值，填入即自动生效
  shear_gamma_note: "γ ≈ k×N 为经验估算，仅用于相对比较，不是实测剪切力"

density_input:                      # 答复#5：两类浓度务必区分，界面单位统一 x10^6 cells/mL
  seed_conc_typical_mcells_ml: [1.0, 5.0]      # CD_seed = 摇瓶/种子罐收获浓度常见区间
  seed_conc_red_max_mcells_ml: 10.0            # CD_seed > 10 报红（并入 R15）
  reactor_initial_density_yellow_range_mcells_ml: [0.5, 5.0]   # 接种后反应器内起始密度合理区间，区间外报黄（并入 R15）
  reactor_initial_density_hard_max_mcells_ml: 20.0             # 起始密度输入上限放到 20 并报黄（并入 R15）

alkali_pump:                        # 答复#6：配置单输出项
  max_rate_ml_per_min_per_L: 0.05   # 每分钟每升培养体积最多允许补加的碱液 mL 数（安全上限建议值，硬件配置页可改）
  note: "仅供参考，以 my-Control 实际 PID 整定为准"

sampling:                           # 规则 R17
  max_cumulative_fraction_of_working: 0.10     # 累计取样体积不超过工作体积 10%（硬件配置页可改）

do_alarm:                           # 答复#7：CHO 高密度（10-25 x10^6）耗氧陡增，报警调灵敏（第四轮使用）
  deviation_yellow_points: 10       # DO 低于设定点 10 个百分点（持续判定见下）
  deviation_yellow_minutes: 15      # 持续 15 分钟报黄
  deviation_red_minutes: 30         # 持续 30 分钟报红
  absolute_red_percent: 20          # 绝对红线：DO < 20% 立即报红
  gap_default_hours: 0.5            # 兜底取样间隔（小时）：数据里推不出取样节奏时使用
  gap_max_factor: 1.5               # 断档判定倍数：间隔 > 中位取样间隔×此倍数 时，DO 事件在此处断开、时长不再累计

metabolite_limits:                  # 答复#10：CHO 低糖限制性补料策略（第四轮使用）
  glucose_g_l: { yellow_below: 2.0, red_below: 0.5, target_range: [2.0, 4.0] }   # 黄=提示补糖，红=耗竭，目标 2-4
  lactate_g_l: { yellow_above: 2.0, red_above: 4.0 }
  lactate_mw_g_mol: 90.08           # 界面同显 g/L 与 mmol/L：mmol/L = g/L / 90.08 * 1000

harvest_hint:                       # 模块 3 收获建议（第四轮使用）
  viability_below_percent: 80       # 活率 < 80% 且密度下降时提示收获

csv_import:                         # 答复#8：先按通用格式写解析器，真实文件到手后替换（第四轮使用）
  encoding: "utf-8"
  delimiter: ","
  header_row: 1
  datetime_iso_format: "%Y-%m-%d %H:%M:%S"
  encoding_fallbacks: ["utf-8-sig", "gb18030"]   # 第五轮：文件不是首选 UTF-8 时的技术兜底顺序（首选不变），并给中文提示
  time_format_fallbacks: ["%Y-%m-%dT%H:%M:%S", "%Y-%m-%d %H:%M", "%Y-%m-%d", "%Y/%m/%d %H:%M:%S", "%Y/%m/%d %H:%M"]   # 第五轮：ISO 时间的常见等价写法
  numeric_time_allowed: true                     # 第五轮：时间列完全无法按时间解析时，允许当作"数值=相对小时"兜底（给警告）
  max_rows: 200000                               # 第五轮：单次导入行数上限，超出即拒绝并提示先在 Web UI 里筛掉无关时间段
  column_mapping_ui: true           # 第四轮提供"列名映射配置页"，手动对应真实列名
  simulator_output_marker: "SIMULATED"   # 模拟 CSV 生成脚本输出必须显著标注 SIMULATED，不得混入交付物

setup_sheet_export:                 # 答复#9：不做 PDF，省掉 reportlab
  clipboard_copy: true              # 一键复制（第三轮）
  txt_file: true                    # 导出 .txt（第六轮前视需要，当前以 CSV 为主）
  csv_file: true                    # 一键导出开机配置单 CSV（第三轮）
  csv_encoding: "utf-8-sig"         # 带 BOM，Excel/WPS 双击打开中文不乱码
  pdf: false

storage:                            # 答复#11：模板库（第五轮使用 SQLite）
  engine: "sqlite3"
  templates_db_path: "data/templates.db"

recipes:                            # 第三轮：轻量"配方"= 界面输入参数的命名存档（JSON 文件）
  dir: "data/recipes"               # 配方保存目录
  builtin_default_name: "CHO 默认配方"   # 配方名输入框的占位默认名

total_cells:                        # 第四轮：提示词文档§四(一)公式3 N_total = V_work × CD_inoc（单位换算固定为 细胞数/mL × mL）
  display_unit: "×10⁶ cells"        # 界面与配置单显示单位（800 ×10⁶ cells 即 8.0×10⁸）

agitation_start_suggestion:         # 第四轮：提示词文档§四(一)公式6 —— 按工作体积段给搅拌初始转速建议（仅建议，仍受 R05 校验）
  bands_ml:                         # 自上而下匹配第一个满足 max_ml 的段；max_ml: null 表示"以上"
    - { max_ml: 1000, rpm: 80 }     # V_work ≤ 1.0 L
    - { max_ml: 1800, rpm: 100 }    # 1.0 - 1.8 L
    - { max_ml: null, rpm: 120 }    # > 1.8 L

setup_sheet_strict:                 # 第四轮：提示词文档§五(二)"红色必须阻止生成配置单"
  block_export_on_error: true       # true=存在 🔴 时禁止导出/复制配置单

ui_defaults:                        # 第二轮新增：界面初始值集中管理（默认值不写死在界面代码）
  working_volume_ml: 2000           # 目标工作体积初始值（requirements 3.3 算例常用体积，硬件配置页可改）
  seed_conc_mcells_ml: 3.0          # CD_seed 初始值（常见区间 1-5 中值，requirements 3.3 算例）
  sampling_total_ml: 0              # 第三轮：计划累计取样体积初始值 mL（R17 输入）
  expression_temp_enabled: false    # 默认不启用表达阶段降温
  cell_line_name: "CHO-DG44"        # 细胞株初始文本
  medium_type: "CD 化学限定培养基"  # 培养基类型初始文本
# =============================================================
# 第五轮新增（2026-11-11）：模块 3 离线分析 + 列名映射页 + 模块 4 SQLite 模板库 + 模拟数据生成器
# 依据：用户第一轮答复 #7 / #8 / #10 / #11，requirements.md 第四节 模块 3 与模块 4
# 说明：报警阈值仍集中在 do_alarm / metabolite_limits / harvest_hint；下面 analysis 段只放"算法怎么算"的参数
# =============================================================

column_mapping:                        # 答复#8：拿到真实导出文件后，在"列名映射"页手动对应列名
  mapping_file: "data/column_mapping.json"     # 手动映射结果存这里（data 下，不进 git）
  auto_match_case_sensitive: false     # 自动匹配时忽略大小写与多余空格
  logical_fields:                      # 逻辑字段清单；dataset=control 控制数据 / offline 离线取样 / both 两者都要
    - key: time
      label: "时间戳"
      unit: "YYYY-MM-DD HH:MM:SS"
      dataset: "both"
      required: true
      candidates: ["time", "timestamp", "datetime", "date_time", "date", "sample time", "run time", "time [h]", "时间", "采样时间", "运行时间"]
    - key: temperature_c
      label: "温度"
      unit: "°C"
      dataset: "control"
      required: false
      candidates: ["temperature", "temp", "temp [c]", "t [c]", "temperature_c", "temp_c", "温度"]
    - key: ph
      label: "pH"
      unit: ""
      dataset: "control"
      required: false
      candidates: ["ph", "ph value", "ph_measure", "ph 值"]
    - key: do_percent
      label: "DO 溶解氧"
      unit: "%"
      dataset: "control"
      required: true
      candidates: ["do", "do [%]", "do_percent", "do_value", "oxygen", "po2", "溶氧", "溶解氧"]
    - key: agitation_rpm
      label: "搅拌转速"
      unit: "rpm"
      dataset: "control"
      required: false
      candidates: ["rpm", "agitation", "agitation rpm", "stirrer", "stirrer speed", "impeller rpm", "搅拌", "搅拌转速"]
    - key: air_ml_min
      label: "Air 流量"
      unit: "mL/min"
      dataset: "control"
      required: false
      candidates: ["air", "air flow", "air_ml_min", "air flow ml/min", "mfc air", "gas flow", "空气流量"]
    - key: o2_ml_min
      label: "O2 流量"
      unit: "mL/min"
      dataset: "control"
      required: false
      candidates: ["o2", "o2 flow", "o2_ml_min", "oxygen flow", "mfc o2", "氧气流量"]
    - key: co2_ml_min
      label: "CO2 流量"
      unit: "mL/min"
      dataset: "control"
      required: false
      candidates: ["co2", "co2 flow", "co2_ml_min", "carbon dioxide flow", "mfc co2", "二氧化碳流量"]
    - key: cell_density_mcells_ml
      label: "细胞密度（离线计数）"
      unit: "×10⁶ cells/mL"
      dataset: "offline"
      required: true
      candidates: ["cells", "cell density", "celldensity", "vcd", "x10^6 cells/ml", "cells ml", "cell count", "密度", "细胞密度", "细胞浓度"]
    - key: viability_percent
      label: "细胞活率"
      unit: "%"
      dataset: "offline"
      required: false
      candidates: ["viability", "via", "live", "live cells percent", "viable", "活率", "存活率"]
    - key: glucose_g_l
      label: "葡萄糖"
      unit: "g/L"
      dataset: "offline"
      required: false
      candidates: ["glucose", "glc", "glucose g/l", "glc g/l", "葡萄糖"]
    - key: lactate_g_l
      label: "乳酸"
      unit: "g/L"
      dataset: "offline"
      required: false
      candidates: ["lactate", "lac", "lactate g/l", "lac g/l", "lactic acid", "乳酸"]

unit_constants:                        # 单位换算用的化学常数（不是工艺阈值，故与 metabolite_limits 分开登记）
  glucose_mw_g_mol: 180.16             # 葡萄糖分子量；乳酸分子量沿用 metabolite_limits.lactate_mw_g_mol = 90.08（答复#10），不重复定义

analysis:                              # 模块 3 分析算法参数
  time_axis_unit: "h"                  # 分析内部时间轴统一用"小时"（由时间戳差值换算）
  growth_fit_min_points: 3             # 密度上升段少于 3 个点时不做 ln X 对 t 的线性回归（逐段 μ 仍可计算，公式 6）
  exponential_rate_tolerance: 0.8   # 第五轮：指数期窗口判定的无量纲容差（瞬时生长率 >= 0.8 x 最大瞬时生长率），算法参数不是工艺阈值
  do_extrapolation:
    lookback_hours: 6.0                # DO 消耗速率外推的回溯窗口（仅信息展示，红黄判定仍由 do_alarm 负责）
    min_points: 3                      # 窗口内少于 3 个点则不外推
  report_title: "CHO 细胞批次离线分析报告"   # 导出分析报告 CSV 的标题行
  report_export:
    csv_encoding: "utf-8-sig"          # 分析报告 CSV 编码，与开机配置单一致（Excel/WPS 双击不乱码）

template_library:                      # 模块 4：SQLite 模板库（答复#11）
  db_path_key: "storage.templates_db_path"   # 库文件路径只从 storage 段读取，避免两处配置打架
  setup_template_kind: "批次配置模板"
  compare_fields:                      # "多批次关键参数对比"表格展示的摘要字段（来自分析摘要的 key）
    - { key: peak_density_mcells_ml, label: "峰值细胞密度 (×10⁶ cells/mL)" }
    - { key: peak_viability_percent, label: "峰值活率 (%)" }
    - { key: mu_max_per_day, label: "最大比生长速率 μ (1/天)" }
    - { key: doubling_time_hours, label: "倍增时间 (小时)" }
    - { key: glucose_min_g_l, label: "葡萄糖最低 (g/L)" }
    - { key: lactate_max_g_l, label: "乳酸最高 (g/L)" }
    - { key: do_yellow_minutes, label: "DO 偏差累计时长 (分钟)" }
    - { key: n_do_alarms, label: "DO 报警事件数" }
    - { key: days_observed, label: "数据覆盖天数" }
    - { key: is_simulated, label: "是否模拟数据" }

simulation:                            # tools/make_simulated_csv.py 的默认参数（仅用于构造测试数据，非工艺推荐值）
  out_dir: "data/simulated"
  filename_prefix: "SIMULATED"         # 答复#8：文件名与每行标记列都要显式标注 SIMULATED，不得混入交付物
  marker_column: "data_source"
  marker_value: "SIMULATED"
  control_interval_minutes: 5
  offline_interval_days: 1.0
  days: 10
  initial_density_mcells_ml: 0.4       # 与 requirements 3.1/3.3 算例的目标接种密度 0.4×10⁶ cells/mL 一致
  mu_max_per_day: 0.5                  # 测试构造值，用于验证公式 6 的回归能拟合出来
  peak_density_mcells_ml: 20.0         # 测试构造值（答复#7：CHO 高密度可达 10-25×10⁶，取区间内整数）
  decline_days_after_peak: 3
  viability_start_percent: 99.0
  viability_end_percent: 65.0          # 测试构造值：让收获提示（活率 <80%）在末段被触发
  glucose_start_g_l: 8.0
  glucose_end_g_l: 0.3                 # 测试构造值：跨越 metabolite_limits 黄线 2.0 与红线 0.5
  lactate_start_g_l: 0.5
  lactate_end_g_l: 4.6                 # 测试构造值：跨越黄线 2.0 与红线 4.0
  do_dip_yellow_start_hours: 48
  do_dip_yellow_minutes: 20            # 构造"低于设定点 10 个百分点持续 20 分钟"→ 应报黄（阈值 15/30 分钟）
  do_dip_red_start_hours: 72
  do_dip_red_minutes: 40               # 构造"持续 40 分钟"→ 应报红
  do_absolute_red_start_hours: 96
  do_absolute_red_minutes: 10          # 构造"DO < 20% 持续 10 分钟"→ 应立即报红
  columns:                               # 模拟 CSV 的表头列名（放 config 便于将来对齐真实导出格式）
    control: ["time", "temperature_c", "ph", "do_percent", "agitation_rpm", "air_ml_min", "o2_ml_min", "co2_ml_min", "data_source"]
    offline: ["time", "cell_density_mcells_ml", "viability_percent", "glucose_g_l", "lactate_g_l", "data_source"]

# =============================================================
# 第五轮新增（2026-11-11）：模块 5 SOP 防呆引导（requirements.md 第四节 模块 5 / 第七节"第五轮"）
# 检查条目全部集中在这里，界面按此渲染；严禁把条目文字写进代码。
# =============================================================
sop:
  require_all_checked_for_export: false   # false=未全部勾选也能导出确认单（但逐条标注"未确认"）；true=禁止导出
  reset_on_new_batch: true                # 每次开机重新勾选，不允许沿用上一批次的勾选状态
  export:
    csv_encoding: "utf-8-sig"             # 与开机配置单一致，Excel/WPS 双击不乱码
  stages:
    - key: pre_sterilization
      name: "高压灭菌前"
      items:
        - "确认反应器型号与工作体积设定在最小/最大工作体积允许区间内（对应 R01）"
        - "罐体、盖板、Marine 叶轮、O 形圈齐全，无裂纹/变形/老化"
        - "曝气头为烧结（约 15 um）型式，禁止使用 L 型管直吹（对应 R16）"
        - "温度/pH/DO 电极已校准，电缆与接头无损、编号对得上"
        - "培养基、碱液、消泡剂按本软件开机配置单量好并挂标签"
        - "气路连接正确：Air 接空压机、O2 与 CO2 接对应 MFC，通气检漏无泄漏"
    - key: before_inoculation
      name: "接种前"
      items:
        - "灭菌循环参数（温度/时间）与灭菌记录已复核并签字"
        - "反应器已平衡：温度、pH、DO、搅拌转速均达到设定点并稳定"
        - "种子液活率与密度已计数，CD_seed > 目标接种密度（对应 R15）"
        - "接种体积 V_seed 按本软件公式 1 计算，并由第二人复核"
        - "接种口按 SOP 消毒，操作在火焰旁或无菌转移接口（Biorouter）下完成"
        - "累计取样体积计划不超过工作体积的规定比例（对应 R17）"
    - key: running
      name: "运行中"
      items:
        - "每天记录细胞密度、活率、葡萄糖、乳酸，并对照本软件的黄/红警戒线"
        - "DO 持续低于设定点报警阈值时，按提示检查搅拌转速、通气量与种子密度"
        - "观察泡沫高度与消泡剂用量，防止泡沫顶罐或消泡剂过量"
        - "pH 漂移异常时先核对 CO2 配比与碱泵流量，再考虑改设定点"
        - "取样后及时补液，并把每次取样量记入台账（供 R17 累计校验）"
        - "任何手动改动 MFC/转速前，回到①页重算并校验，禁止凭经验直接改"
    - key: harvest
      name: "收获"
      items:
        - "达到目标培养天数，或本软件③页给出『建议收获』提示（活率低于阈值且密度下降）"
        - "收获前最后一次取样数据完整，已导出 CSV 并在③页做完离线分析"
        - "收获体积、细胞总数、活率、产物滴度记录进批次台账"
        - "按 SOP 完成罐体初洗、电极保护液加注与可拆卸部件检查"
        - "在⑤模板库页把本批次分析结果保存为批次记录，便于多批次对比"

# =============================================================
# 第六轮新增（2026-11-12）：软件身份信息与桌面版（.exe）运行设置
# 说明：这里放"软件叫什么、版本号、窗口标题怎么拼、日志/说明书/图标文件名、exe 文件名"。
#       这些不是工艺参数，但同样集中在 config，严禁散写进代码。
# =============================================================
app_info:
  name: "细胞培养接种与批次配置规划软件"
  version: "1.1.0"
  round_label: "第七轮：三大板块界面（配置与校验 / 分析与对比 / SOP 引导）"
  title_template: "{name}　{version}｜{round_label}｜{mode}"   # 窗口标题；mode 由程序填「打包版」或「源码版」
  log_dir: "logs"                       # 运行日志目录（相对程序目录，自动创建）
  log_file: "软件运行日志.txt"           # 出错时把中文堆栈追加到这里，可直接发给开发者
  log_max_mb: 5                         # 日志超过此大小先轮转为 .old，避免无限膨胀
  manual_file: "使用说明.txt"            # 随 exe 一起分发的中文说明书文件名
  icon_file: "assets/app.ico"           # 窗口/ exe 图标（相对程序目录或包内资源目录）
  exe_name: "细胞培养接种与批次配置规划软件"   # tools/build_exe.py 生成的 exe 主名
  locations_template: "你的文件都在这里：配置 {config}｜数据目录 {data}｜运行日志 {log}｜说明书 {manual}"   # ①页底部灰色一行的文案；花括号由程序填入真实路径
  tab_titles:                           # 六个页签的显示名称；窄屏/高缩放时可自己改短，改完重启软件生效
    - "① 配置与校验"
    - "② 硬件配置"
    - "③ 离线分析"
    - "④ 列名映射"
    - "⑤ 模板库对比"
    - "⑥ SOP 引导"
  outer_tab_titles:                     # 第七轮：主界面只有这 3 个大板块；原 6 页变成板块内的子页签
    - "配置与校验"                       #   子页签「① 配置与校验」「② 硬件配置」
    - "分析与对比"                       #   子页签「④ 列名映射」「③ 离线分析」「⑤ 模板库对比」
    - "SOP 引导"                         #   子页签「⑥ SOP 引导」
  ui_texts:                             # 第七轮：本轮新增的界面文案集中在这里，代码只按键取值、不把句子写死
    mapping_goto: "去「列名映射」"                 # 「离线分析」子页顶部的跳转按钮文字
    mapping_ok: "✅ 列名映射已完成：{n} 个必需字段都已对应到真实列名，可以直接点「▶ 运行分析」。"
    mapping_missing: "⚠️ 请先在『列名映射』完成必需字段映射：还差 {n} 项（控制数据 {ctrl} 项、离线取样 {off} 项）。保存后回到本页会自动刷新。"
    mapping_unreadable: "⚠️ 请先在『列名映射』完成必需字段映射：映射文件暂时读不了（{reason}），请到该页检查后重新保存。"
    hw_intro: |                       # 「② 硬件配置」页顶部两句说明；{planner} 自动填第一个子页签名称
      在这里修改硬件上下限与推荐参数默认值，点「保存并生效」后写回 config/config.yaml（自动保留注释，并备份为 config.yaml.bak）。
      改完回到「{planner}」点「恢复默认值」即可套用新默认；所有校验规则会立即使用新阈值。
  theme:                                # 第七轮：界面外观集中在这里，换配色/改边距不用动代码（改完重启生效）
    primary: "#2E7D8C"                  # 主色（蓝绿）：选中页签、按钮、聚焦边框
    primary_dark: "#246573"             # 主色加深：按钮悬停/按下
    primary_light: "#E8F1F3"            # 主色浅底：未选中页签、表头、选中行
    window_bg: "#F4F6F7"                # 窗口背景（浅灰白）
    base_bg: "#FFFFFF"                  # 内容底（输入框/分组/表格）
    text: "#26323A"                     # 正文颜色
    muted_text: "#8A96A0"               # 禁用/次要文字
    border: "#C7D3D8"                   # 统一描边
    pass_bg: "#E3F4E3"                  # 校验语义色：绿=通过（与界面表格底色同源，勿随意改）
    warn_bg: "#FFF6C8"                  # 校验语义色：黄=警告
    error_bg: "#FFD5D5"                 # 校验语义色：红=拦截/错误
    none_bg: "#EEEEEE"                  # 校验语义色：灰=无数据/不适用
    pass_fg: "#1B6B32"                  # 绿档文字
    warn_fg: "#8A6100"                  # 黄档文字
    error_fg: "#B00000"                 # 红档文字（底部免责声明同色）
    font_family: ""                     # 留空=用系统默认中文字体；要指定就写 "Microsoft YaHei UI"
    font_pt: 10                         # 正文字号
    title_pt: 11                        # 分组标题字号（比正文大 1 号）
    mono_family: "Consolas"             # 数字结果区等宽字体，便于逐行对齐
    margin_outer: 16                    # 每个子页的外边距（px）
    margin_group: 10                    # QGroupBox 分组内边距（px）
    spacing: 8                          # 控件间距（px）
    control_height: 28                  # 输入框/下拉框/按钮统一高度（px）
